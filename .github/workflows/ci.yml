name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  source:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@6bd06a55307dccfd7057c1c3260067eb8adc93a1 # v0.6.79
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      node-version: '26.13.1'
      bun-version: '1.4.4'
      tools: just@1.59.0
      tool-assets: .github/ci-tools.json
      prepare: setup
      recipe: verify-source
      fetch-depth: 0
      timeout-minutes: 20

  bootstrap-smoke:
    if: github.event_name != 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@6bd06a55307dccfd7057c1c3260067eb8adc93a1 # v0.6.79
    permissions:
      contents: read
    with:
      hosted-runner: macos-26
      tools: just@1.59.0
      recipe: test
      timeout-minutes: 15

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@6bd06a55307dccfd7057c1c3260067eb8adc93a1 # v0.6.79
    permissions:
      contents: read

  gate:
    needs: [source, bootstrap-smoke, merge-stops]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the actual source and native outcomes
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"source":"success","bootstrap-smoke":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
